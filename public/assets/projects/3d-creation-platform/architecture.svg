<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">三维创作框架能力结构</title>
  <desc id="desc">多个产品通过内部三维创作 SDK 复用编辑交互、资产任务和高斯与 Mesh 混合渲染能力。</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#dce4f0" stroke-width="1"/></pattern>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#f7f9fd"/><stop offset="1" stop-color="#eef3ff"/></linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)" opacity=".45"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <text x="64" y="67" font-size="15" font-weight="650" letter-spacing="3" fill="#3559e0">ENGINEERING CASE STUDY</text>
    <text x="64" y="122" font-size="42" font-weight="700" fill="#19243b">三维创作框架能力结构</text>
    <text x="64" y="157" font-size="19" fill="#626e83">三维创作框架 · 统一资产任务 · 高斯与 Mesh 混合编辑</text>
    <rect x="64" y="202" width="1072" height="66" rx="14" fill="#fff" stroke="#cbd6e8"/>
    <text x="91" y="243" font-size="20" font-weight="600" fill="#253654">产品接入</text>
    <text x="270" y="243" font-size="19" fill="#626e83">业务界面与创作流程</text>
    <rect x="907" y="219" width="201" height="32" rx="16" fill="#edf1ff"/>
    <text x="1007" y="241" text-anchor="middle" font-size="15" font-weight="600" fill="#3559e0">多产品复用</text>
    <path d="M600 268V302" fill="none" stroke="#91a6cc" stroke-width="2"/>
    <rect x="64" y="302" width="1072" height="65" rx="14" fill="#253e82"/>
    <text x="600" y="343" text-anchor="middle" font-size="23" font-weight="650" fill="#fff">内部三维创作 SDK</text>
    <path d="M600 367V392M232 413V392H968V413M600 392V413" fill="none" stroke="#91a6cc" stroke-width="2"/>
    <g fill="#fff" stroke="#cbd6e8"><rect x="64" y="413" width="336" height="126" rx="14"/><rect x="432" y="413" width="336" height="126" rx="14"/><rect x="800" y="413" width="336" height="126" rx="14"/></g>
    <g font-size="23" font-weight="650" fill="#253654" text-anchor="middle"><text x="232" y="456">编辑交互</text><text x="600" y="456">资产任务</text><text x="968" y="456">混合渲染</text></g>
    <g font-size="17" fill="#626e83" text-anchor="middle"><text x="232" y="491">放置 · 动作 · 高亮 · 截图</text><text x="600" y="491">生成 · 进度 · 重试 · 资产库</text><text x="968" y="491">SPZ + Mesh · 单位与场景切换</text></g>
    <text x="64" y="589" font-size="15" fill="#626e83">Renjie / 技术负责人 · 前端主导</text>
    <text x="1136" y="589" text-anchor="end" font-size="15" fill="#626e83">能力结构示意</text>
